<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relative Clauses - Sentence Reconstruction</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#fff4d6,#ffd39b);
    color:#4d3200;
    max-width:1000px;
    margin:auto;
    padding:25px;
}

h1{
    text-align:center;
    color:#cc6600;
}

.instructions{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    border-left:6px solid #ff9900;
}

.question{
    background:white;
    margin-bottom:20px;
    padding:18px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.parts{
    background:#fff9ed;
    padding:10px;
    border-radius:8px;
    margin:10px 0;
}

.options{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:10px;
}

label{
    padding:10px;
    border:2px solid #ffd18a;
    border-radius:8px;
    cursor:pointer;
    background:white;
}

label:hover{
    background:#fff5e6;
}

button{
    display:block;
    margin:30px auto;
    padding:14px 30px;
    border:none;
    border-radius:8px;
    background:#ff9900;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#e67e00;
}

.correct{
    color:green;
    font-weight:bold;
    margin-top:10px;
}

.wrong{
    color:crimson;
    font-weight:bold;
    margin-top:10px;
}

#score{
    font-size:24px;
    font-weight:bold;
    text-align:center;
    color:#cc6600;
    margin:20px 0;
}
</style>
</head>
<body>

<h1>Relative Clauses - Sentence Reconstruction</h1>

<div class="instructions">
<p><strong>Instructions:</strong> Combine the two sentences into one sentence using a relative clause. Choose the best answer.</p>
</div>

<div id="quiz"></div>

<button onclick="checkAnswers()">Check Answers</button>

<div id="score"></div>

<script>

const questions = [

{
parts:[
"The footballer scored the winning goal in the final.",
"The footballer had missed several matches earlier in the season."
],
options:[
"The footballer who had missed several matches earlier in the season scored the winning goal in the final.",
"The footballer had missed several matches who scored the winning goal in the final.",
"The footballer which had missed several matches earlier in the season scored the winning goal in the final."
],
correct:0
},

{
parts:[
"The stadium was completely renovated last year.",
"The stadium will host the European Championship qualifiers."
],
options:[
"The stadium who will host the European Championship qualifiers was completely renovated last year.",
"The stadium that will host the European Championship qualifiers was completely renovated last year.",
"The stadium where will host the European Championship qualifiers was completely renovated last year."
],
correct:1
},

{
parts:[
"The cyclist won the race.",
"The cyclist trained at high altitude for several months."
],
options:[
"The cyclist who trained at high altitude for several months won the race.",
"The cyclist trained at high altitude for several months won the race.",
"The cyclist which trained at high altitude for several months won the race."
],
correct:0
},

{
parts:[
"The coach introduced a new tactical system.",
"The tactical system helped the team win eight games in a row."
],
options:[
"The coach introduced a new tactical system who helped the team win eight games in a row.",
"The coach introduced a new tactical system that helped the team win eight games in a row.",
"The coach introduced a new tactical system where helped the team win eight games in a row."
],
correct:1
},

{
parts:[
"The athlete is preparing for the Olympics.",
"The athlete broke the national record last year."
],
options:[
"The athlete that broke the national record last year is preparing for the Olympics.",
"The athlete broke the national record last year is preparing for the Olympics.",
"The athlete whose broke the national record last year is preparing for the Olympics."
],
correct:0
},

{
parts:[
"The referee reviewed the footage.",
"The footage showed the controversial incident from several angles."
],
options:[
"The referee reviewed the footage that showed the controversial incident from several angles.",
"The referee reviewed the footage who showed the controversial incident from several angles.",
"The referee reviewed the footage shown the controversial incident from several angles."
],
correct:0
},

{
parts:[
"The Formula 1 driver signed a new contract.",
"The Formula 1 driver won five races during the previous season."
],
options:[
"The Formula 1 driver who won five races during the previous season signed a new contract.",
"The Formula 1 driver won five races during the previous season signed a new contract.",
"The Formula 1 driver whose won five races during the previous season signed a new contract."
],
correct:0
},

{
parts:[
"The sports centre is located near the river.",
"The sports centre offers training facilities for professional athletes."
],
options:[
"The sports centre who offers training facilities for professional athletes is located near the river.",
"The sports centre that offers training facilities for professional athletes is located near the river.",
"The sports centre where offers training facilities for professional athletes is located near the river."
],
correct:1
},

{
parts:[
"The tennis player thanked her coach.",
"The coach had supported her throughout a difficult recovery."
],
options:[
"The tennis player thanked her coach, who had supported her throughout a difficult recovery.",
"The tennis player thanked her coach that had supported her throughout a difficult recovery.",
"The tennis player thanked her coach where had supported her throughout a difficult recovery."
],
correct:0
},

{
parts:[
"The marathon attracted thousands of runners.",
"The marathon takes place every spring."
],
options:[
"The marathon, which takes place every spring, attracted thousands of runners.",
"The marathon, that takes place every spring, attracted thousands of runners.",
"The marathon, who takes place every spring, attracted thousands of runners."
],
correct:0
}

];

const quiz = document.getElementById("quiz");

questions.forEach((q,index)=>{

quiz.innerHTML += `
<div class="question">

<h3>Question ${index+1}</h3>

<div class="parts">
<strong>Sentence A:</strong> ${q.parts[0]}<br>
<strong>Sentence B:</strong> ${q.parts[1]}
</div>

<div class="options">
${q.options.map((option,i)=>`
<label>
<input type="radio" name="q${index}" value="${i}">
${option}
</label>
`).join("")}
</div>

<div id="result${index}"></div>

</div>
`;

});

function checkAnswers(){

let score = 0;

questions.forEach((q,index)=>{

const selected =
document.querySelector(`input[name="q${index}"]:checked`);

const result =
document.getElementById(`result${index}`);

if(!selected){
    result.innerHTML =
    "<div class='wrong'>Please select an answer.</div>";
    return;
}

if(Number(selected.value) === q.correct){

    score++;

    result.innerHTML =
    "<div class='correct'>✔ Correct</div>";

}else{

    result.innerHTML =
    "<div class='wrong'>✘ Incorrect</div>";

}

});

document.getElementById("score").innerHTML =
`Score: ${score} / ${questions.length}`;

}

</script>

</body>
</html>
