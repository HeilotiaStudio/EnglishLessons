<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relative Clauses - Sentence Reconstruction</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#fff4d6,#ffd39b);
    color:#4d3200;
    max-width:1000px;
    margin:auto;
    padding:25px;
}

h1{
    text-align:center;
    color:#cc6600;
}

.instructions{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    border-left:6px solid #ff9900;
}

.question{
    background:white;
    margin-bottom:20px;
    padding:18px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.parts{
    background:#fff9ed;
    padding:10px;
    border-radius:8px;
    margin:10px 0;
}

.options{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:10px;
}

label{
    padding:10px;
    border:2px solid #ffd18a;
    border-radius:8px;
    cursor:pointer;
    background:white;
}

label:hover{
    background:#fff5e6;
}

button{
    display:block;
    margin:30px auto;
    padding:14px 30px;
    border:none;
    border-radius:8px;
    background:#ff9900;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#e67e00;
}

.correct{
    color:green;
    font-weight:bold;
    margin-top:10px;
}

.wrong{
    color:crimson;
    font-weight:bold;
    margin-top:10px;
}

#score{
    font-size:24px;
    font-weight:bold;
    text-align:center;
    color:#cc6600;
    margin:20px 0;
}
</style>
</head>
<body>

<h1>Relative Clauses - Sentence Reconstruction</h1>

<div class="instructions">
<p><strong>Instructions:</strong> Combine the two sentences into one sentence using a relative clause. Choose the best answer.</p>
</div>

<div id="quiz"></div>

<button onclick="checkAnswers()">Check Answers</button>

<div id="score"></div>

<script>

const questions = [

{
parts:[
"The footballer scored the winning goal in the Champions League final.",
"He had spent nearly eight months recovering from a serious knee injury."
],
options:[
"The footballer, who had spent nearly eight months recovering from a serious knee injury, scored the winning goal in the Champions League final.",
"The footballer scored the winning goal in the Champions League final who had spent nearly eight months recovering from a serious knee injury.",
"The footballer, which had spent nearly eight months recovering from a serious knee injury, scored the winning goal in the Champions League final."
],
correct:0
},

{
parts:[
"The stadium recently underwent an extensive renovation.",
"The World Cup final will be played there next summer."
],
options:[
"The stadium where the World Cup final will be played next summer recently underwent an extensive renovation.",
"The stadium which the World Cup final will be played there next summer recently underwent an extensive renovation.",
"The stadium who the World Cup final will be played next summer recently underwent an extensive renovation."
],
correct:0
},

{
parts:[
"The athlete won three Olympic gold medals.",
"Her determination inspired young sportspeople around the world."
],
options:[
"The athlete whose determination inspired young sportspeople around the world won three Olympic gold medals.",
"The athlete who determination inspired young sportspeople around the world won three Olympic gold medals.",
"The athlete which determination inspired young sportspeople around the world won three Olympic gold medals."
],
correct:0
},

{
parts:[
"The cycling race attracted thousands of spectators.",
"It takes place every year in the mountains."
],
options:[
"The cycling race, which takes place every year in the mountains, attracted thousands of spectators.",
"The cycling race, that takes place every year in the mountains, attracted thousands of spectators.",
"The cycling race, where takes place every year in the mountains, attracted thousands of spectators."
],
correct:0
},

{
parts:[
"The coach introduced a tactical system.",
"The tactical system allowed the team to qualify for an international tournament."
],
options:[
"The coach introduced a tactical system which allowed the team to qualify for an international tournament.",
"The coach introduced a tactical system whom allowed the team to qualify for an international tournament.",
"The coach introduced a tactical system where allowed the team to qualify for an international tournament."
],
correct:0
},

{
parts:[
"The year was unforgettable for Formula 1 fans.",
"Max Verstappen won his first world championship that year."
],
options:[
"The year when Max Verstappen won his first world championship was unforgettable for Formula 1 fans.",
"The year who Max Verstappen won his first world championship was unforgettable for Formula 1 fans.",
"The year which Max Verstappen won his first world championship was unforgettable for Formula 1 fans."
],
correct:0
},

{
parts:[
"The tennis player thanked her coach after the victory.",
"The coach had supported her during her difficult recovery."
],
options:[
"The tennis player thanked her coach, who had supported her during her difficult recovery.",
"The tennis player thanked her coach, which had supported her during her difficult recovery.",
"The tennis player thanked her coach, where had supported her during her difficult recovery."
],
correct:0
},

{
parts:[
"The sports complex opened last month.",
"Professional athletes will train at the complex."
],
options:[
"The sports complex where professional athletes will train opened last month.",
"The sports complex who professional athletes will train opened last month.",
"The sports complex whose professional athletes will train opened last month."
],
correct:0
},

{
parts:[
"The referee reviewed video footage.",
"The footage clearly showed what had happened during the controversial incident."
],
options:[
"The referee reviewed video footage which clearly showed what had happened during the controversial incident.",
"The referee reviewed video footage who clearly showed what had happened during the controversial incident.",
"The referee reviewed video footage whose clearly showed what had happened during the controversial incident."
],
correct:0
},

{
parts:[
"The swimmer broke the national record.",
"Her performance exceeded everyone's expectations."
],
options:[
"The swimmer whose performance exceeded everyone's expectations broke the national record.",
"The swimmer who performance exceeded everyone's expectations broke the national record.",
"The swimmer which performance exceeded everyone's expectations broke the national record."
],
correct:0
}

];

const quiz = document.getElementById("quiz");

questions.forEach((q,index)=>{

quiz.innerHTML += `
<div class="question">

<h3>Question ${index+1}</h3>

<div class="parts">
<strong>Sentence A:</strong> ${q.parts[0]}<br>
<strong>Sentence B:</strong> ${q.parts[1]}
</div>

<div class="options">
${q.options.map((option,i)=>`
<label>
<input type="radio" name="q${index}" value="${i}">
${option}
</label>
`).join("")}
</div>

<div id="result${index}"></div>

</div>
`;

});

function checkAnswers(){

let score = 0;

questions.forEach((q,index)=>{

const selected =
document.querySelector(`input[name="q${index}"]:checked`);

const result =
document.getElementById(`result${index}`);

if(!selected){
    result.innerHTML =
    "<div class='wrong'>Please select an answer.</div>";
    return;
}

if(Number(selected.value) === q.correct){

    score++;

    result.innerHTML =
    "<div class='correct'>✔ Correct</div>";

}else{

    result.innerHTML =
    "<div class='wrong'>✘ Incorrect</div>";

}

});

document.getElementById("score").innerHTML =
`Score: ${score} / ${questions.length}`;

}

</script>

</body>
</html>
