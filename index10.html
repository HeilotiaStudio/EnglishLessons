<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tense Transformation Quiz</title>

<style>
body {
    background: linear-gradient(135deg, #fff2cc, #ffd699);
    font-family: Arial, sans-serif;
    color: #4a2f00;
    margin: 0;
    padding: 25px;
}

h1 {
    text-align: center;
    color: #cc6600;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    margin-bottom: 30px;
    font-size: 18px;
}

.sentence-box {
    background: #fffaf0;
    border-left: 6px solid #ff9900;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
}

.sentence-box strong {
    display: block;
    margin-bottom: 12px;
}

.options {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

label {
    background: white;
    padding: 10px;
    border-radius: 8px;
    border: 2px solid #ffd27f;
    cursor: pointer;
    transition: 0.2s;
}

label:hover {
    background: #fff3e0;
    border-color: #ff9900;
}

input[type="radio"] {
    margin-right: 8px;
}

button {
    display: block;
    margin: 30px auto;
    padding: 14px 30px;
    border: none;
    border-radius: 8px;
    background: #ff9900;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #e67e00;
}

.correct {
    color: green;
    font-weight: bold;
    margin-top: 10px;
}

.wrong {
    color: crimson;
    font-weight: bold;
    margin-top: 10px;
}

#score {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    margin-top: 20px;
    color: #cc6600;
}
</style>
</head>

<body>

<h1>Tense Transformation Quiz</h1>
<div class="subtitle">
Choose the sentence with the correct tense transformation.
</div>

<div id="exercise"></div>

<button onclick="checkAnswers()">Check Answers</button>

<div id="score"></div>

<script>

const questions = [

{
sentence: "Change to <b>Past Simple</b>:<br><br>Lionel Messi has inspired millions of young footballers around the world by consistently producing exceptional performances in some of the most demanding competitions in professional sport.",
options: [
"Lionel Messi inspired millions of young footballers around the world by consistently producing exceptional performances in some of the most demanding competitions in professional sport.",
"Lionel Messi had inspired millions of young footballers around the world by consistently producing exceptional performances in some of the most demanding competitions in professional sport.",
"Lionel Messi will inspire millions of young footballers around the world by consistently producing exceptional performances in some of the most demanding competitions in professional sport."
],
correct: 0
},

{
sentence: "Change to <b>Future Simple</b>:<br><br>The national basketball team trains intensely throughout the year in order to compete successfully against the strongest teams in Europe.",
options: [
"The national basketball team trained intensely throughout the year in order to compete successfully against the strongest teams in Europe.",
"The national basketball team has trained intensely throughout the year in order to compete successfully against the strongest teams in Europe.",
"The national basketball team will train intensely throughout the year in order to compete successfully against the strongest teams in Europe."
],
correct: 2
},

{
sentence: "Change to <b>Present Perfect</b>:<br><br>The athlete won several international championships despite suffering a serious injury that threatened to end his career prematurely.",
options: [
"The athlete has won several international championships despite suffering a serious injury that threatened to end his career prematurely.",
"The athlete had won several international championships despite suffering a serious injury that threatened to end his career prematurely.",
"The athlete will win several international championships despite suffering a serious injury that threatened to end his career prematurely."
],
correct: 0
},

{
sentence: "Change to <b>Past Perfect</b>:<br><br>The coaching staff analysed hours of footage before they developed a tactical plan capable of neutralising their opponents' strongest attacking players.",
options: [
"The coaching staff have analysed hours of footage before they developed a tactical plan capable of neutralising their opponents' strongest attacking players.",
"The coaching staff had analysed hours of footage before they developed a tactical plan capable of neutralising their opponents' strongest attacking players.",
"The coaching staff will have analysed hours of footage before they develop a tactical plan capable of neutralising their opponents' strongest attacking players."
],
correct: 1
},

{
sentence: "Change to <b>Future Perfect</b>:<br><br>The Formula 1 team develops innovative aerodynamic upgrades that significantly improve the car's performance during high-speed sections of the circuit.",
options: [
"The Formula 1 team will develop innovative aerodynamic upgrades that significantly improve the car's performance during high-speed sections of the circuit.",
"The Formula 1 team has developed innovative aerodynamic upgrades that significantly improve the car's performance during high-speed sections of the circuit.",
"The Formula 1 team will have developed innovative aerodynamic upgrades before the middle of the season."
],
correct: 2
},

{
sentence: "Change to <b>Past Simple</b>:<br><br>The tennis player has reached multiple Grand Slam finals while competing against some of the strongest opponents of the modern era.",
options: [
"The tennis player reached multiple Grand Slam finals while competing against some of the strongest opponents of the modern era.",
"The tennis player had reached multiple Grand Slam finals while competing against some of the strongest opponents of the modern era.",
"The tennis player will reach multiple Grand Slam finals while competing against some of the strongest opponents of the modern era."
],
correct: 0
},

{
sentence: "Change to <b>Future Simple</b>:<br><br>The marathon runner follows a highly demanding training schedule that includes endurance sessions, strength exercises and specialised recovery techniques.",
options: [
"The marathon runner followed a highly demanding training schedule that included endurance sessions, strength exercises and specialised recovery techniques.",
"The marathon runner will follow a highly demanding training schedule that includes endurance sessions, strength exercises and specialised recovery techniques.",
"The marathon runner has followed a highly demanding training schedule that includes endurance sessions, strength exercises and specialised recovery techniques."
],
correct: 1
},

{
sentence: "Change to <b>Present Perfect</b>:<br><br>The football club invested substantial resources in its youth academy in order to develop talented players for the first team.",
options: [
"The football club had invested substantial resources in its youth academy in order to develop talented players for the first team.",
"The football club has invested substantial resources in its youth academy in order to develop talented players for the first team.",
"The football club will invest substantial resources in its youth academy in order to develop talented players for the first team."
],
correct: 1
},

{
sentence: "Change to <b>Future Perfect</b>:<br><br>The organisers improve the facilities every year to ensure that both athletes and spectators enjoy a world-class sporting experience.",
options: [
"The organisers have improved the facilities every year to ensure that both athletes and spectators enjoy a world-class sporting experience.",
"The organisers will improve the facilities every year to ensure that both athletes and spectators enjoy a world-class sporting experience.",
"By the start of next year's competition, the organisers will have improved the facilities to ensure a world-class sporting experience."
],
correct: 2
},

{
sentence: "Change to <b>Past Perfect</b>:<br><br>The referee made the final decision only after reviewing several camera angles that showed exactly what had happened during the incident.",
options: [
"The referee had made the final decision only after reviewing several camera angles that showed exactly what had happened during the incident.",
"The referee has made the final decision only after reviewing several camera angles that showed exactly what had happened during the incident.",
"The referee will make the final decision only after reviewing several camera angles that show exactly what happened during the incident."
],
correct: 0
}

];

const container = document.getElementById("exercise");

questions.forEach((q, i) => {

container.innerHTML += `
<div class="sentence-box">
    <strong>${i + 1}. ${q.sentence}</strong>

    <div class="options">
        ${q.options.map((opt, idx) => `
        <label>
            <input type="radio" name="q${i}" value="${idx}">
            ${opt}
        </label>
        `).join("")}
    </div>

    <div id="result${i}"></div>
</div>
`;

});

function checkAnswers() {

let score = 0;

questions.forEach((q, i) => {

const selected = document.querySelector(`input[name="q${i}"]:checked`);
const result = document.getElementById(`result${i}`);

if (!selected) {
    result.innerHTML = "<div class='wrong'>Please select an answer.</div>";
    return;
}

if (Number(selected.value) === q.correct) {
    score++;
    result.innerHTML = "<div class='correct'>✔ Correct</div>";
}
else {
    result.innerHTML =
        "<div class='wrong'>✘ Incorrect</div>";
}

});

document.getElementById("score").innerHTML =
`Score: ${score} / ${questions.length}`;

}

</script>

</body>
</html>
