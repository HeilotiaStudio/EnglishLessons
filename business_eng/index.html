<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listening Practice</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#fff3dc;
    padding:30px;
    max-width:900px;
    margin:auto;
    color:#4d3200;
}

h1{
    text-align:center;
    color:#c76b00;
}

.audio-box{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:10px;
    border-left:6px solid #ffae42;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    transition:all 0.3s ease;
}

.audio-box.playing{
    background:#fff8c9;
    border-left-color:#28a745;
    box-shadow:0 0 18px rgba(40,167,69,.4);
}

.audio-title{
    font-weight:bold;
    margin-bottom:10px;
    font-size:18px;
}

.status{
    display:inline-block;
    margin-left:15px;
    font-weight:bold;
    color:#777;
}

button{
    background:#ffae42;
    border:none;
    color:white;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    margin-right:8px;
    margin-top:5px;
}

button:hover{
    background:#e68a00;
}


</style>
</head>
<body>

<h1>Listening Practice</h1>

<div id="container"></div>

<script>

const audioFiles = [
    "nr1.mp3",
    "nr2.mp3",
    "nr3.mp3",
    "nr4.mp3",
    "nr5.mp3",
    "nr6.mp3",
    "nr7.mp3",
    "nr8.mp3",
    "nr9.mp3"
];

const container = document.getElementById("container");

audioFiles.forEach((file,index)=>{

    container.innerHTML += `
        <div class="audio-box" id="box${index}">

            <div class="audio-title">
                Audio ${index + 1}
                <span class="status" id="status${index}">
                    ⏹ Stopped
                </span>
            </div>

            <audio id="audio${index}">
                <source src="${file}" type="audio/mpeg">
            </audio>

            <button onclick="playAudio(${index})">
                ▶ Play
            </button>

            <button onclick="pauseAudio(${index})">
                ⏸ Pause
            </button>

            <button onclick="restartAudio(${index})">
                ↺ Restart
            </button>

        </div>
    `;

});

audioFiles.forEach((_, index) => {

    const audio = document.getElementById("audio" + index);

    audio.addEventListener("ended", () => {

        document
            .getElementById("box" + index)
            .classList.remove("playing");

        document
            .getElementById("status" + index)
            .textContent = "⏹ Finished";

    });

});

function clearHighlights(){

    document.querySelectorAll(".audio-box")
        .forEach(box => box.classList.remove("playing"));

    document.querySelectorAll(".status")
        .forEach(status => status.textContent = "⏹ Stopped");

}

function stopAllExcept(current){

    document.querySelectorAll("audio").forEach(audio => {

        const id = Number(audio.id.replace("audio",""));

        if(id !== current){

            audio.pause();

            document
                .getElementById("box" + id)
                .classList.remove("playing");

            document
                .getElementById("status" + id)
                .textContent = "⏹ Stopped";

        }

    });

}

function playAudio(index){

    stopAllExcept(index);

    const audio = document.getElementById("audio" + index);

    document
        .querySelectorAll(".audio-box")
        .forEach(box => box.classList.remove("playing"));

    document
        .getElementById("box" + index)
        .classList.add("playing");

    document
        .getElementById("status" + index)
        .textContent = "▶ Playing";

    audio.play();

}

function pauseAudio(index){

    const audio = document.getElementById("audio" + index);

    audio.pause();

    document
        .getElementById("box" + index)
        .classList.remove("playing");

    document
        .getElementById("status" + index)
        .textContent = "⏸ Paused";

}

function restartAudio(index){

    const audio = document.getElementById("audio" + index);

    audio.pause();
    audio.currentTime = 0;

    document
        .getElementById("box" + index)
        .classList.remove("playing");

    document
        .getElementById("status" + index)
        .textContent = "⏹ Restarted";

}

</script>

</body>
</html>
