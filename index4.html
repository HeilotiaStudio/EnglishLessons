<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Present → Past Practice</title>

<style>
    body {
        background: #0d0d0d;
        color: #e6e6e6;
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    h1 {
        color: #00eaff;
        text-shadow: 0 0 10px #00eaff;
    }

    .sentence-box {
        background: #1a1a1a;
        padding: 15px;
        margin-bottom: 20px;
        border-left: 4px solid #00eaff;
        border-radius: 6px;
    }

    input[type="text"] {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        background: #0d0d0d;
        color: #e6e6e6;
        border: 2px solid #00eaff;
        border-radius: 4px;
        outline: none;
        box-shadow: 0 0 5px #00eaff;
    }

    input[type="text"]:focus {
        box-shadow: 0 0 10px #00eaff;
    }

    button {
        background: #00eaff;
        color: #000;
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 20px;
        box-shadow: 0 0 10px #00eaff;
    }

    .correct {
        color: #00ff88;
        font-weight: bold;
        margin-top: 5px;
    }

    .wrong {
        color: #ff4444;
        font-weight: bold;
        margin-top: 5px;
    }
</style>
</head>

<body>

<h1>Present → Past Practice</h1>

<div id="container"></div>

<button onclick="checkAnswers()">Check Answers</button>

<script>
const presentSentences = [
    "This month, I am focusing on improving my project management skills.",
    "Next week, our team is starting a new training program.",
    "The following month, I plan to reorganize my workspace completely.",
    "Later this year, she is launching her own online course.",
    "Next year, we are expanding our business into new markets.",
    "This week, he is preparing a detailed report for the management team.",
    "Tomorrow, they are meeting with a new client to discuss collaboration.",
    "This afternoon, I am reviewing all the documents for the upcoming meeting.",
    "Next Monday, the company is introducing updated security guidelines.",
    "This season, we are focusing on improving customer satisfaction."
];

const pastSentences = [
    "Last month, I focused on improving my project management skills.",
    "Last week, our team started a new training program.",
    "The previous month, I reorganized my workspace completely.",
    "Earlier this year, she launched her own online course.",
    "Last year, we expanded our business into new markets.",
    "Last week, he prepared a detailed report for the management team.",
    "Yesterday, they met with a new client to discuss collaboration.",
    "Yesterday afternoon, I reviewed all the documents for the upcoming meeting.",
    "Last Monday, the company introduced updated security guidelines.",
    "Last season, we focused on improving customer satisfaction."
];

const container = document.getElementById("container");

// Build HTML
presentSentences.forEach((sentence, i) => {
    container.innerHTML += `
        <div class="sentence-box">
            <div><strong>${sentence}</strong></div>
            <input type="text" id="input${i}" placeholder="Write the past version here...">
            <div id="result${i}"></div>
        </div>
    `;
});

function checkAnswers() {
    for (let i = 0; i < presentSentences.length; i++) {
        const userInput = document.getElementById("input" + i).value.trim();
        const resultBox = document.getElementById("result" + i);

        if (userInput === "") {
            resultBox.innerHTML = "";
            continue; // skip empty fields
        }

        if (userInput.toLowerCase() === pastSentences[i].toLowerCase()) {
            resultBox.innerHTML = "<div class='correct'>Correct!</div>";
        } else {
            resultBox.innerHTML = "<div class='wrong'>Wrong. Correct answer:<br>" + pastSentences[i] + "</div>";
        }
    }
}
</script>

</body>
</html>
